# Snakemake workflow profile for running the "recover" example on Mahuika (NeSI).
#
# Usage (from the recover/ directory):
#   module load snakemake/9.16.3
#   snakemake --profile profile
#
# Requires Snakemake >= 8 (executor-plugin architecture) with the
# snakemake-executor-plugin-slurm plugin available -- both are provided by
# the snakemake/9.16.3 module on Mahuika. Do not use the default `snakemake`
# module without a version pin: it may resolve to an older pre-8.0 release
# that does not understand `executor: slurm`.
#
# Per-task retry behaviour (up to 3 attempts, larger runtime each time) is
# controlled by the `retries:` directive on the run_task rule in the
# Snakefile itself, not by a setting in this profile.

executor: slurm
jobs: 10
latency-wait: 60
retries: 2
default-resources:
  mem_mb: 512
  runtime: 5
  cpus_per_task: 1
