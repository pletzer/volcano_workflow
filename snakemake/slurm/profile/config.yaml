# Snakemake workflow profile for running the "slurm" example on Mahuika (NeSI).
#
# Usage (from the slurm/ directory):
#   snakemake --profile profile
#
# IMPORTANT: set slurm_account below to your NeSI project code before
# running, or override it on the command line -- see README.md.

executor: slurm
jobs: 10
latency-wait: 60
default-resources:
  mem_mb: 512
  runtime: 5
  cpus_per_task: 1
