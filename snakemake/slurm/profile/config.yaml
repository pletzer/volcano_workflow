# Snakemake workflow profile for running the "slurm" example on Mahuika (NeSI).
#
# Usage (from the slurm/ directory):
#   module load snakemake/9.16.3
#   snakemake --profile profile
#
# Requires Snakemake >= 8 (executor-plugin architecture) with the
# snakemake-executor-plugin-slurm plugin available -- both are provided by
# the snakemake/9.16.3 module on Mahuika. Do not use the default `snakemake`
# module without a version pin: it may resolve to an older pre-8.0 release
# (e.g. 7.32.3) that does not understand `executor: slurm`.

executor: slurm
jobs: 10
latency-wait: 60
default-resources:
  mem_mb: 512
  runtime: 5
  cpus_per_task: 1
