name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextflow-test:
    name: nextflow run main.nf -profile test
    runs-on: ubuntu-latest   # 4 CPUs, 16 GB: matches the test profile (executor.cpus = 4, peak ~8 GB)
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.10.2'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # no pip cache: seislib and bayesbay compile with -march=native, so a wheel cached
          # on one runner can crash with "Illegal instruction" on a runner with another CPU

      # each task activates venv/ (params.venv), as set up in the README.
      # seislib and bayesbay are only distributed as source and build Cython extensions
      # (--no-cache-dir: see above)
      - name: Create the venv
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install --no-cache-dir -r requirements.txt

      - name: Run the test profile
        env:
          MPLBACKEND: Agg
        run: nextflow run main.nf -profile test -ansi-log false

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-test-output
          path: |
            output/
            .nextflow.log
          if-no-files-found: ignore
